<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<script src="https://zipaddr.github.io/bankauto0.js" charset="UTF-8"></script>
<meta charset="UTF-8">
<style>
.skill-note {
    text-align: right;
    margin-bottom: 8px;
}
.skill-table {
    border-collapse: collapse;
    width: 780px;
}
.skill-table td {
    border: 1px solid #000;
    height: 26px;
    padding: 2px 4px;
}
.skill-title {
    background-color: #d8ffff;
    text-align: center;
    width: 90px;
    vertical-align: middle;
}
.skill-name {
    width: 95px;
}
.skill-select {
    width: 28px;
    text-align: center;
    padding: 0;
}
.skill-select select {
    width: 26px;
}
</style>
<title>社員登録</title>
</head>
<script>
function checkRegister() {

    function value(name) {
        return document.getElementsByName(name)[0].value.trim();
    }

    function required(name, label) {
        if (value(name) === "") {
            alert(label + "を入力してください。");
            return false;
        }
        return true;
    }

    function maxLength(name, label, max) {
        if (value(name).length > max) {
            alert(label + "は" + max + "文字数以下で入力してください。");
            return false;
        }
        return true;
    }

    function pattern(name, label, regex, typeName) {
        if (value(name) !== "" && !regex.test(value(name))) {
            alert(label + "は" + typeName + "で入力してください。");
            return false;
        }
        return true;
    }

    // 社員コードチェック
	if (!required("syainCode", "社員コード")) return false;
	if (!pattern("syainCode", "社員コード", /^[A-Za-z0-9]+$/, "A-Z、a-z、0-9")) return false;
	if (!maxLength("syainCode", "社員コード", 10)) return false;
	// 社員名（漢字）_姓
	if (!required("firstNameKanji", "社員名（漢字）_姓")) return false;
	if (!pattern("firstNameKanji", "社員名（漢字）_姓", /^[^\x00-\x7F]+$/, "全角")) return false;
	if (!maxLength("firstNameKanji", "社員名（漢字）_姓", 15)) return false;
	// 社員名（漢字）_名
	if (!required("lastNameKanji", "社員名（漢字）_名")) return false;
	if (!pattern("lastNameKanji", "社員名（漢字）_名", /^[^\x00-\x7F]+$/, "全角")) return false;
	if (!maxLength("lastNameKanji", "社員名（漢字）_名", 15)) return false;
	// 社員名（カタカナ）_セイ
	if (!required("firstNameKana", "社員名（カタカナ）_セイ")) return false;
	if (!pattern("firstNameKana", "社員名（カタカナ）_セイ", /^[^\x00-\x7F]+$/, "全角")) return false;
	if (!maxLength("firstNameKana", "社員名（カタカナ）_セイ", 15)) return false;
	// 社員名（カタカナ）_メイ
	if (!required("lastNameKana", "社員名（カタカナ）_メイ")) return false;
	if (!pattern("lastNameKana", "社員名（カタカナ）_メイ", /^[^\x00-\x7F]+$/, "全角")) return false;
	if (!maxLength("lastNameKana", "社員名（カタカナ）_メイ", 15)) return false;
	// 社員名（英語）_姓
	if (!required("firstNameEigo", "社員名（英語）_姓")) return false;
	if (!pattern("firstNameEigo", "社員名（英語）_姓", /^[A-Za-z]+$/, "英字")) return false;
	if (!maxLength("firstNameEigo", "社員名（英語）_姓", 30)) return false;
	// 社員名（英語）_名
	if (!required("lastNameEigo", "社員名（英語）_名")) return false;
	if (!pattern("lastNameEigo", "社員名（英語）_名", /^[A-Za-z]+$/, "英字")) return false;
	if (!maxLength("lastNameEigo", "社員名（英語）_名", 30)) return false;
	// 金融機関コード
    if (!required("kinyukikanCode", "金融機関コード")) return false;
	if (!pattern("kinyukikanCode", "金融機関コード", /^[0-9]+$/, "数字のみ")) return false;
	if (!maxLength("kinyukikanCode", "金融機関コード", 10)) return false;
	// 金融機関名
    if (!required("kinyukikanName", "金融機関名")) return false;
	if (!pattern("kinyukikanName", "金融機関名", /^[^\x00-\x7F]+$/, "全角")) return false;
	if (!maxLength("kinyukikanName", "金融機関名", 50)) return false;
	//支店名コード
    if (!required("sitenCode", "支店名コード")) return false;
	if (!pattern("sitenCode", "支店名コード", /^[0-9]+$/, "数字のみ")) return false;
	if (!maxLength("sitenCode", "支店名コード", 10)) return false;
	//支店名
    if (!required("sitenName", "支店名")) return false;
	if (!pattern("sitenName", "支店名", /^[^\x00-\x7F]+$/, "全角")) return false;
	if (!maxLength("sitenName", "支店名", 50)) return false;
	//口座番号
    if (!required("kouzaNum", "口座番号")) return false;
	if (!pattern("kouzaNum", "口座番号", /^[0-9]+$/, "数字のみ")) return false;
	if (!maxLength("kouzaNum", "口座番号", 10)) return false;
	//名義人
    if (!required("meigiName", "名義人")) return false;
	if (!maxLength("meigiName", "名義人", 50)) return false;

    return true;
}
</script>
<body>

<h2>社員登録</h2>
<form action="/user/registerSyain"
      method="post"
      onsubmit="return checkRegister()">

	<h3>基本情報</h3>
	<table border="0">
	    <tr>
	        <td>社員コード：</td>
	        <td>
	            <input type="text" name="syainCode">
	        </td>
	    </tr>
	    <tr>
	        <td>社員名（漢字）</td>
	        <td>
	            姓 <input type="text" name="firstNameKanji">
	            名 <input type="text" name="lastNameKanji">
	            必須
	        </td>
	    </tr>
	    <tr>
	        <td>社員名（カタカナ）</td>
	        <td>
	            セイ <input type="text" name="firstNameKana">
	            メイ <input type="text" name="lastNameKana" >
	            必須
	        </td>
	    </tr>
	    <tr>
	        <td>社員名（英語）</td>
	        <td>
	            first name <input type="text" name="firstNameEigo" >
	            last name <input type="text" name="lastNameEigo" >
	            必須
	        </td>
	    </tr>
	    <tr>
	        <td>性別</td>
	        <td>
	            <label><input type="radio" name="seibetu" value="1" checked> 男</label>
	            <label><input type="radio" name="seibetu" value="2"> 女</label>
	        </td>
	    </tr>
	</table>
	
	<h3>会社関連情報</h3>
	<table border="0">
	    <tr>
	        <td>所属会社</td>
	        <td>
	            <select name="syozokuKaisya">
	                <option th:each="company : ${companyList}"
	                        th:value="${company.category2}"
	                        th:text="${company.value1}">
	                </option>
	            </select>
	            必須
	        </td>
	    </tr>
	    <tr>
	        <td>入社日</td>
	        <td>
	            <input type="date" name="nyuusyaDate">
	            必須
	        </td>
	    </tr>
	    <tr>
	        <td>退社日</td>
	        <td>
	            <input type="date" name="taisyaDate">
	        </td>
	    </tr>
	    <tr>
	        <td>職業種類</td>
	        <td>
	            <select name="syokugyoKind">
	                <option th:each="job : ${jobList}"
	                        th:value="${job.category3}"
	                        th:text="${job.value1}"
	                        th:selected="${job.value1 == 'ITエンジニア'}">
	                </option>
	            </select>
	            必須
	        </td>
	    </tr>
	</table>

	<h3>給与関連情報</h3>
	<table border="1" cellspacing="0" cellpadding="5">
	    <tr>
	        <td colspan="6">給与振込口座</td>
	    </tr>
	    <tr>
	        <th>金融機関コード</th>
	        <th>金融機関名</th>
	        <th>支店コード</th>
	        <th>支店名</th>
	        <th>口座番号</th>
	        <th>名義人</th>
	    </tr>
		<tr>
		    <td>
				<input type="text" name="kinyukikanCode" id="bank_code" maxlength="10">
		    </td>

		    <td>
		        <input type="text" name="kinyukikanName" id="bank_name" maxlength="50" readonly>
		    </td>

		    <td>
		        <input type="text" name="sitenCode" id="branch_code" maxlength="10">
		    </td>

		    <td>
		        <input type="text" name="sitenName" id="branch_name" maxlength="50" readonly>
		    </td>

		    <td>
		        <input type="text" name="kouzaNum" maxlength="10">
		    </td>

		    <td>
		        <input type="text" name="meigiName"maxlength="50">
		    </td>
		</tr>
	</table>

	<h3>技術経験</h3>
	<div class="skill-note">
	    ◎：実務経験１年以上 ／ ○：実務経験有り ／ △：知識有り
	</div>
	<table class="skill-table">
	    <tbody>
	        <tr th:each="os, stat : ${osList}" th:if="${stat.index % 5 == 0}">
	            <td class="skill-title"
	                th:if="${stat.index == 0}"
	                th:rowspan="${(osList.size() + 4) / 5}">
	                O S
	            </td>
	            <th:block th:each="i : ${#numbers.sequence(stat.index, stat.index + 4)}">
	                <td class="skill-name" th:if="${i < osList.size()}"
	                    th:text="${osList[i].value1}">
	                </td>
					<td class="skill-select" th:if="${i < osList.size()}">
					    <select name="itOsLevel">
					        <option value=""></option>
					        <option value="1">◎</option>
					        <option value="2">○</option>
					        <option value="3">△</option>
					    </select>
					    <input type="hidden" name="itOsId" th:value="${osList[i].category3}">
					</td>
	            </th:block>
	        </tr>
	    </tbody>
	</table>
	
    <button type="submit">登録</button>
</form>

</body>
</html>
