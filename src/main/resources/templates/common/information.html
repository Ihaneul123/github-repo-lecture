<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>社員管理</title>
</head>
<body>

<h2>社員管理</h2>

<h3>■検索条件</h3>

<form id="searchForm">
    所属会社
    <select name="companyId">
        <option value="">全て</option>
    </select>

    社員名
    <input type="text" name="employeeName">

    <br><br>

    職業種類
    <select name="jobKind">
        <option value="ITエンジニア">ITエンジニア</option>
    </select>

    在職
    <input type="checkbox" name="working" checked>

    非在職
    <input type="checkbox" name="retired">

    <br><br>

    <button type="button">検索</button>
</form>

<h3>■社員一覧</h3>

<div>
    件数：<span id="count">0</span>件
    <button type="button">新規登録</button>
</div>

<table border="1" width="100%">
    <thead>
        <tr>
            <th>所属会社</th>
            <th>社員名</th>
            <th>性別</th>
            <th>職業種類</th>
            <th>入社日</th>
            <th>退社日</th>
            <th>編集</th>
        </tr>
    </thead>
    <tbody>
        <!-- 나중에 DB 결과 표시 -->
    </tbody>
</table>

</body>
</html>
